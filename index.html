:root{--night:#0b2224;--moss:#2f6b4f;--lime:#b8e068;--cy:#5ee6d6;--amb:#ffc857;--cor:#ff6b57;--mist:#e3f6ec;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--night);overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--mist);touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
h1,h2,h3,.bl{font-family:'Baloo 2',Nunito,sans-serif;margin:0}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:none;pointer-events:none;gap:12px;align-items:flex-start;justify-content:space-between;box-sizing:border-box}
.bar{height:14px;border-radius:9px;background:#0007;border:2px solid #fff3;overflow:hidden;width:min(220px,42vw)}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b57,#ff9f6b)}
.bar.x i{background:linear-gradient(90deg,#5ee6d6,#b8e068);width:0}
#tm{font-family:'Baloo 2';font-weight:800;font-size:22px;text-align:center;text-shadow:0 2px 0 #000a}.runbadge{position:fixed;left:12px;top:calc(78px + env(safe-area-inset-top,0px));background:#0b2224cc;border:1px solid #5ee6d655;border-radius:12px;padding:6px 9px;font-size:11px;display:none;pointer-events:none}.runbadge b{display:block;color:#b8e068}.runbadge span{opacity:.8}
#pb{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:2px solid #fff5;background:#0b2224cc;color:var(--mist);font-size:18px;font-weight:800}
#bossbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(420px,80vw);display:none;text-align:center}
#bossbar .bar{width:100%;height:18px}#bossbar .bar i{background:linear-gradient(90deg,#b13cff,#ff6b57)}
#tip{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:'Baloo 2';font-size:22px;pointer-events:none;text-shadow:0 2px 6px #000;display:none;padding:0 20px}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow:auto;background:#06161855}
#ov.on{display:flex}
.card{width:min(560px,100%);background:linear-gradient(160deg,#10373ae6,#0b2224e6);backdrop-filter:blur(6px);border:3px solid #07150f;outline:2px solid #b8e068aa;border-radius:22px 22px 22px 6px;padding:22px;box-shadow:0 18px 50px #000a;max-height:100%;overflow:auto}
.ver{display:inline-block;font-weight:800;font-size:11px;background:#5ee6d633;color:#b8e068;border:1px solid #5ee6d655;border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:middle}.tag{display:inline-block;font-weight:800;font-size:13px;background:var(--amb);color:#2a1d00;border-radius:8px 8px 8px 2px;padding:3px 10px;margin-bottom:10px}
.card h2{font-size:24px;line-height:1.25;margin-bottom:14px}
.btn{display:block;width:100%;margin-top:9px;padding:12px 14px;border-radius:14px;border:2px solid #5ee6d655;background:#12474a;color:var(--mist);font:800 16px Nunito;text-align:left;cursor:pointer}
.btn:active{transform:translateY(2px)}.btn:hover{border-color:var(--cy)}
.btn.go{background:linear-gradient(180deg,#c9ee7d,#8fc24a);color:#10260a;text-align:center;border-color:#e5ffb0;font-family:'Baloo 2';font-size:20px}
.btn.on{background:#1f6b5d;border-color:var(--lime)}
.btn small{display:block;font-weight:600;opacity:.75;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:110px;text-align:center}
.pat{font-size:30px;letter-spacing:6px;text-align:center;padding:12px;background:#0006;border-radius:12px;margin-bottom:6px;font-family:'Baloo 2'}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:700;line-height:1.4}
.fb.ok{background:#2c6b36}.fb.no{background:#7a2c2c}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:2px solid #5ee6d655;background:#08191b;color:var(--mist);font:800 18px Nunito;margin:6px 0 4px}
.title{font-size:clamp(44px,10vw,72px);line-height:.9;color:#d8ff7a;-webkit-text-stroke:3px #07150f;paint-order:stroke fill;text-shadow:0 5px 0 #1b6b3a,0 10px 18px #0008;transform:rotate(-2deg);margin-bottom:6px}
.sub{font-family:'Baloo 2';font-size:22px;color:var(--amb)}
.m{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:800}.m b{width:104px;font-weight:800}
.m .bar{flex:1;width:auto}.m .bar i{background:var(--cy)}
.ch{width:30px;height:30px;border-radius:50%;margin:0 auto 4px;border:3px solid #fff8}
.card{position:relative;border-radius:26px 26px 26px 8px;box-shadow:0 22px 60px #000b,inset 0 1px 0 #ffffff22}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#ff3da8,#ffc857,#b8e068,#5ee6d6)}
.card{padding-top:28px}
.hero{background:radial-gradient(120% 80% at 80% -10%,#1f6b5dcc,#0b2224f0 60%)}
.lead{opacity:.9;margin:10px 0 6px;line-height:1.45}.lb{font-weight:800;font-size:14px;color:var(--amb);margin-top:10px}
.cs{gap:8px;margin-top:6px}.cs .btn{min-width:0;flex:1 1 0}
.cc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:16px}
.cc canvas{position:static;inset:auto;display:block;width:68px;height:92px}.cc b{font-family:'Baloo 2';font-size:15px}
.cc.on{border-color:#d8ff7a;background:linear-gradient(180deg,#2c7a52,#17503a);box-shadow:0 4px 0 #07150f,0 0 0 3px #d8ff7a66}
.btn{border:2px solid #07150f;box-shadow:0 4px 0 #07150f,inset 0 1px 0 #ffffff25;background:linear-gradient(180deg,#17595a,#0f4244)}
.btn:hover{border-color:#07150f;filter:brightness(1.12);transform:translateY(-2px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #07150f}
.btn.go{background:linear-gradient(180deg,#d4f58a,#8fc24a);box-shadow:0 5px 0 #4a7a22,0 7px 0 #07150f;margin-top:16px;font-size:22px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 12px}.opt span{flex:1}
.lt{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#ffc857;color:#2a1d00;font-family:'Baloo 2';border:2px solid #07150f}
.opt.on{background:linear-gradient(180deg,#2f9a62,#1d6b46)}.opt.on .lt{background:#d8ff7a}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.qh .tag{margin:0}
.tb{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,#ffc857,#ff8a3d);border:3px solid #07150f;box-shadow:0 3px 0 #07150f}
.pat{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:none;padding:0 0 8px;letter-spacing:0}
.tl{min-width:42px;height:46px;padding:0 4px;box-sizing:border-box;display:grid;place-items:center;border-radius:10px;background:#0a2a2c;border:2px solid #07150f;box-shadow:0 3px 0 #07150f;font:800 24px 'Baloo 2';color:#ffc857}.tl.q{background:#ffc857;color:#2a1d00}
.fb.ok{background:linear-gradient(180deg,#2f8a45,#236b35);border:2px solid #07150f}.fb.no{background:linear-gradient(180deg,#9a3a3a,#742727);border:2px solid #07150f}
.bar.x i{background:linear-gradient(90deg,#ff3da8,#ffc857)}
.opt small{display:block;font-weight:600;opacity:.8}
.note{margin:-6px 0 10px;font-size:14px;font-weight:700;color:var(--amb)}.btn:disabled{cursor:default;filter:none;transform:none}.btn.right{background:linear-gradient(180deg,#2f9a62,#1d6b46)!important}.btn.wrongc{background:linear-gradient(180deg,#9a3a3a,#742727)!important}.hn{background:linear-gradient(180deg,#5a4a1a,#3d3210)!important;color:#ffe08a;font-size:14px;text-align:center;margin-top:12px}.hint{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#ffc85722;border:2px dashed #ffc857;font-weight:700}.intro{text-align:center;max-width:560px;position:relative;padding:20px}.intro>*:not(.gl):not(.skip){opacity:0;animation:fi 1.2s forwards;animation-delay:var(--d)}.intro p{font:800 24px/1.3 'Baloo 2';margin:0 0 18px}
.gl{position:fixed;font:800 28px 'Baloo 2';color:#5ee6d6;opacity:0;animation:fl 5s infinite}.skip{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:auto;font-size:14px;padding:8px 14px}
@keyframes fi{to{opacity:1}}@keyframes fl{0%{opacity:0;transform:translateY(20px)}40%{opacity:.5}100%{opacity:0;transform:translateY(-40px) rotate(8deg)}}
.ec{margin:8px 0;padding:10px 12px;border-radius:12px;background:#0a2a2c;border:2px solid #07150f;line-height:1.4}.ec.lk{opacity:.5}

{"id":"AL-016","t":"Algoritma","d":1,"k":"mc","q":"Mengapa langkah dalam algoritma harus jelas dan tidak membingungkan?","o":["Agar siapa pun yang menjalankannya mendapat hasil yang sama","Agar langkahnya terlihat lebih sedikit","Agar hanya pembuatnya yang mengerti","Agar setiap orang bebas memakai caranya sendiri"],"a":0,"h":"Langkah yang jelas membuat algoritma bisa dijalankan siapa saja dengan hasil yang sama.","hn":"Apa yang terjadi jika langkahnya bisa ditafsirkan berbeda-beda?"},

{"id":"AL-029","t":"Algoritma","d":3,"k":"order","q":"Urutkan algoritma mencari nilai terbesar dari tiga angka:","items":["Masukkan tiga angka","Anggap angka pertama sebagai terbesar sementara","Bandingkan dengan angka kedua; jika lebih besar, jadikan terbesar","Bandingkan dengan angka ketiga; jika lebih besar, jadikan terbesar","Tampilkan angka terbesar"],"h":"Mulai dari memasukkan angka, tetapkan terbesar sementara, bandingkan satu per satu, lalu tampilkan.","hn":"Perbandingan dilakukan satu per satu sebelum hasil ditampilkan."},
